version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: educareer-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-educareer_ai_360}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: educareer-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educareer-backend
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-educareer_ai_360}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_signing_key_change_me_in_production_min32chars}
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN:-internal_shared_auth_token_for_fastapi_ml_calls}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: educareer-ml-service
    restart: always
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN:-internal_shared_auth_token_for_fastapi_ml_calls}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educareer-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
